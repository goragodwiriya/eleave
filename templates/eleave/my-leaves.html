<div class="card-groups">
    <header>
        <div>
            <h1 class="icon-calendar" data-i18n>My Leave Requests</h1>
            <p data-i18n>Track the status of your leave requests and continue editing pending items</p>
        </div>
        <div>
            <a class="btn btn-primary icon-edit" href="/leave-request" data-i18n>Leave Request</a>
        </div>
    </header>
    <div class="content-body">
        <div class="tablebody">
            <table class="table border fullwidth" data-table="myLeaves" data-source="api/eleave/myleaves" data-default-sort="created_at desc" data-page-size="10"
                   data-show-footer="true" data-footer-aggregates='{"days":"sum"}' data-search-columns="reason,detail" data-action-url="api/eleave/myleaves/action"
                   data-row-actions='{
                    "view":{
                        "label":"View",
                        "className":"btn btn-warning icon-search"
                    },
                    "edit":{
                        "label":"Edit",
                        "className":"btn btn-success icon-edit",
                        "condition":"${status == 0 || status == 5}"
                    },
                    "cancel":{
                        "label":"Cancel",
                        "className":"btn btn-danger icon-ban",
                        "confirm": "{LNG_Confirm cancellation}",
                        "condition":"${status == 0 || status == 5}"
                    }
                }'>
                <thead>
                    <tr>
                        <th data-field="leave_id" data-sort="leave_topic" data-filter="true" data-type="select" data-show-all="true" data-all-value=""
                            data-label="Leave type" data-template="${leave_topic}" data-i18n>{LNG_Leave type}</th>
                        <th data-field="leave_text" data-i18n>{LNG_Leave dates}</th>
                        <th data-field="days" data-sort="days" class="center" data-cell-class="center" data-i18n>{LNG_days}</th>
                        <th data-field="created_at" data-sort="created_at" data-format="datetime" data-filter="true" data-type="daterange" data-range-names="from,to"
                            data-range-presets="today,7d,30d,thismonth,lastmonth" data-label="Date" data-i18n>{LNG_Created}</th>
                        <th data-field="status" data-sort="status" class="center" data-cell-class="center" data-filter="true" data-type="select" data-show-all="true"
                            data-all-value="" data-formatter="formatTableOptionStatus" data-i18n>{LNG_Status}</th>
                        <th data-field="reason" data-sort="reason" data-template="<span class='two_line'>${reason}</span>" data-i18n>{LNG_Reason}</th>
                    </tr>
                </thead>
                <tbody></tbody>
                <tfoot>
                    <tr>
                        <th colspan="2" data-i18n>{LNG_Total}</th>
                        <th data-field="days" data-format="number" class="center" data-i18n></th>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>
